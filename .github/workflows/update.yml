name: Perbarui data cuaca

on:
  schedule:
    - cron: "7,37 * * * *"   # tiap 30 menit (GitHub bisa terlambat beberapa menit)
  workflow_dispatch:          # tombol "Run workflow" untuk menjalankan manual

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil data Open-Meteo
        run: python scripts/fetch.py
      - name: Tren 30 hari (EC46)
        continue-on-error: true
        run: python scripts/outlook.py
      - name: Simpan perubahan
        run: |
          git config user.name "cuaca-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Data cuaca $(TZ=Asia/Makassar date '+%Y-%m-%d %H:%M') WITA"
            git pull --rebase origin main
            git push
          fi
